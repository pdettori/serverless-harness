# Gitleaks configuration.
#
# Two mechanisms suppress a false positive, and they cover different things:
#
#   * `# notsecret` on the offending line. Honoured by the organisation's secret scanner,
#     which is what flags these. It only affects the line as it exists now -- a scanner that
#     walks history still sees the line in every commit that already carries it.
#   * this file. Applies to history too, which is the only way to quiet a string that is
#     already committed. Both are used below for that reason.
#
# `# notsecret` is NOT understood by upstream gitleaks -- the version pinned in
# .pre-commit-config.yaml ignores it and honours `# gitleaks:allow` instead. So an inline
# comment alone does not satisfy the pre-commit hook; the allowlist here is what does.

# WITHOUT THIS BLOCK, EVERY RULE IS DISABLED. Supplying a config replaces the built-in
# ruleset rather than adding to it, so an allowlist-only file scans clean by detecting
# nothing at all -- verified: a planted AWS key went unreported until this was added.
[extend]
useDefault = true

[allowlist]
  description = "Global allowlist: fabricated values that exist to be found by tests and demos"

  # Matched against the secret, so each entry is scoped to one exact fabricated string
  # rather than to a path. A path allowlist would also cover a real credential that lands
  # in that path later; a literal cannot. Add the next fake token here, as a literal.
  regexes = [
    # deploy/knative/demo-promoted-workflow.sh + its fixture. The demo's whole point is that
    # this string is unguessable and reachable ONLY by reading a promoted skill file inside
    # the sandbox, which is how the demo proves the bundle materialised there. It is asserted
    # on in docs/demos/promoted-workflow-demo.md, so it is checked in deliberately.
    '''SHIPNOTE-7F3A-SANDBOX-OK''',

    # The literal spelled into `--from-literal=api-key=`/`auth-token=` by setup-kind.sh,
    # setup-ocp.sh and rc1-ocp-gate.sh when no real key is supplied. `generic-api-key` fires
    # on the assignment, not the value; the value is the placeholder it is named after.
    '''AB1-PLACEHOLDER''',
  ]
